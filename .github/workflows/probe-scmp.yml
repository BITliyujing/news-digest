name: probe-scmp

# 临时探测：确认南华早报（SCMP）RSS 能被正确解析、关键词命中数、正文可取。
# 探测完即删除，不参与日常流程。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 解析与正文测试
        env:
          CLOUD_RUN: "1"
          TZ: Asia/Shanghai
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from digest import fetchers, pipeline
          import run_daily as R

          st = json.load(open("settings.json", encoding="utf-8"))
          cfg = json.load(open("sources.json", encoding="utf-8"))
          mods = cfg["modules"]

          for sid, url in [("scmp-china", "https://www.scmp.com/rss/4/feed"),
                           ("scmp-world", "https://www.scmp.com/rss/5/feed")]:
              src = {"id": sid, "name": sid, "lang": "en", "modules": ["m5"],
                     "channel": {"type": "rss", "url": url}}
              try:
                  items = fetchers.fetch_rss(src, src["channel"], st)
              except Exception as e:
                  print("PROBE | %s | 抓取失败 %s: %s" % (sid, type(e).__name__, e))
                  continue
              print("PROBE | %s | 解析 %d 条" % (sid, len(items)))
              hit = 0
              for it in items[:12]:
                  ks = pipeline.keyword_score(it["title"], it.get("lead", ""), mods["m5"])
                  hit += int(ks > 0)
                  d = it["published"].strftime("%m-%d %H:%M") if it["published"] else "无日期"
                  print("PROBE |   k=%d | %s | %s" % (ks, d, it["title"][:78]))
              print("PROBE | %s | 前12条命中 m5 关键词 %d 条" % (sid, hit))
              for it in items[:3]:
                  print("PROBE | %s | lead=%d | %s" % (sid, len(it.get("lead") or ""),
                                                       (it.get("lead") or "")[:110].replace("\n", " ")))
              if items:
                  t = R.fetch_article_text(items[0], st)
                  print("PROBE | %s | 正文 %d 字: %s" % (sid, len(t), t[:150].replace("\n", " ")))
                  from digest import http
                  code, raw = http.fetch(items[0]["url"], st, referer=items[0]["url"], read_bytes=300000)
                  h = http.decode_html(raw)
                  print("PROBE | %s | 页面 HTTP=%s len=%d url=%s" % (sid, code, len(h), items[0]["url"]))
                  print("PROBE | %s | head: %s" % (sid, h[:260].replace("\n", " ")))
          PY
