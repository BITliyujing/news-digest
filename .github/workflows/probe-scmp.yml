name: probe-scmp

# 临时探测：确认南华早报（SCMP）哪些 RSS 端点从 GitHub 境外出口可达。
# 探测完即删除，不参与日常流程。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 SCMP RSS 端点
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          for u in \
            "https://www.scmp.com/rss/91/feed" \
            "https://www.scmp.com/rss/4/feed" \
            "https://www.scmp.com/rss/5/feed" \
            "https://www.scmp.com/rss/92/feed" \
            "https://www.scmp.com/rss/2/feed" \
            "https://www.scmp.com/rss/3/feed" ; do
            code=$(curl -sL --max-time 25 -A "$UA" -o /tmp/f.xml -w "%{http_code}" "$u" 2>/dev/null || echo ERR)
            n=$(grep -o "<item" /tmp/f.xml 2>/dev/null | wc -l)
            ch=$(grep -o "<title>[^<]*" /tmp/f.xml 2>/dev/null | sed -n 1p | cut -c8-60)
            t2=$(grep -o "<title>[^<]*" /tmp/f.xml 2>/dev/null | sed -n 2p | cut -c8-80)
            echo "RESULT | $u | HTTP=$code | items=$n | channel=$ch | first=$t2"
            rm -f /tmp/f.xml
          done
          echo "--- 正文页可达性 ---"
          c2=$(curl -sL --max-time 25 -A "$UA" -o /tmp/a.html -w "%{http_code}" "https://www.scmp.com/news/china" 2>/dev/null || echo ERR)
          echo "RESULT | https://www.scmp.com/news/china | HTTP=$c2 | bytes=$(wc -c < /tmp/a.html 2>/dev/null)"
