name: probe-gnews4
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          import json, sys, difflib
          sys.path.insert(0, '.')
          from digest import fetchers, pipeline
          from datetime import datetime, timedelta
          import os
          os.environ['http_fast'] = '1'
          s = json.load(open('settings.json', encoding='utf-8'))
          s['source_concurrency'] = 10
          s['http_timeout'] = 18
          s['http_fast'] = True
          d = json.load(open('sources.json', encoding='utf-8'))
          mods = d['modules']
          byid = {x['id']: x for x in d['sources']}
          # 只抓 m5/m7 相关源 + GNews 源（缩小范围省时间）
          gids = {'reuters-world','isw','huxiu-com','economist','barrons-com'}
          sim_ids = {x['id'] for x in d['sources'] if any(m in x.get('modules',[]) for m in ('m5','m7'))}
          want = [x for x in d['sources'] if x['id'] in (gids|sim_ids) and (x.get('active') or x.get('requires_proxy'))]
          print(f"PROBE | 抓取 {len(want)} 个 m5/m7+GNews 源")
          from concurrent.futures import ThreadPoolExecutor
          raw_items = []
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs = {ex.submit(fetchers.fetch_source, src, s): src for src in want}
              for f in futs:
                  src = futs[f]
                  try:
                      items = f.result()[0]
                      if items: raw_items.append((src, items))
                  except Exception:
                      pass
          print(f"PROBE | 抓到 {sum(len(i) for _,i in raw_items)} 条来自 {len(raw_items)} 源")
          # 插桩版 process_items
          now = datetime.now(fetchers.CN_TZ)
          window = timedelta(days=s.get('window_days',1)); grace_exact = timedelta(hours=2)
          limit = window + grace_exact
          cap_src = s.get('per_source_daily_cap',6)
          module_caps = s.get('module_caps',{}) or {}
          thr = s.get('dedupe_threshold',0.72)
          cands = []
          for src, items in raw_items:
              count = 0
              ch_type = src.get('channel',{}).get('type'); sc = src.get('strict_keywords')
              strict = (ch_type=='auto') if sc is None else bool(sc)
              for it in items:
                  if count >= cap_src: break
                  if pipeline._AD_TITLE_RE.search(it.get('title') or ''): continue
                  pub = it.get('published')
                  if pub is not None and (now-pub) > limit: continue
                  mod = pipeline.route_module(it, src, mods)
                  if strict and pipeline.keyword_score(it['title'], it.get('lead',''), mods[mod])==0: continue
                  it = dict(it); it['module']=mod
                  cands.append(it); count += 1
          gnews_c = [x for x in cands if x['source_id'] in gids]
          print(f"PROBE | 候选 {len(cands)} 条，其中 GNews 源 {len(gnews_c)} 条")
          for x in gnews_c: print(f"  CAND | {x['source_id']} [{x['module']}] | {x['title'][:65]}")
          # 去重（复现源码逻辑）
          cands.sort(key=lambda x: -(byid[x['source_id']].get('weight',1.0)))
          kept=[]; deduped=[]
          for it in cands:
              nt = pipeline._norm_title(it['title'])
              if len(nt)<4: continue
              dup=False; killer=''
              for kt,srcid in kept:
                  if difflib.SequenceMatcher(None, nt, kt).ratio() >= thr:
                      dup=True; killer=srcid; break
              if not dup:
                  deduped.append(it); kept.append((nt,it['source_id']))
              elif it['source_id'] in gids:
                  print(f"  DEDUP-KILLED | {it['source_id']} | {it['title'][:55]} | 被重复于 {killer} | {nt[:40]}")
          gnews_d = [x for x in deduped if x['source_id'] in gids]
          print(f"PROBE | 去重后 {len(deduped)} 条，GNews 剩 {len(gnews_d)}")
          # 打分+配额
          scored=[]
          for it in deduped:
              src=byid[it['source_id']]; md=mods[it['module']]
              w=src.get('weight',1.0); kw=pipeline.keyword_score(it['title'],it.get('lead',''),md)
              pub=it.get('published'); rec=0.0
              if pub:
                  hrs=(now-pub).total_seconds()/3600; rec=2.0 if hrs<24 else (1.0 if hrs<48 else 0.2)
              score=w*2+kw*1.5+rec+(0.5 if it.get('lead') else 0)
              scored.append((score,it))
          scored.sort(key=lambda x:-x[0])
          out=[]; per_mod={}
          for score,it in scored:
              m=it['module']; cm=int(module_caps.get(m,s.get('items_per_module_cap',40)))
              if per_mod.get(m,0)>=cm: continue
              per_mod[m]=per_mod.get(m,0)+1; it['score']=round(score,2); out.append(it)
          gnews_o=[x for x in out if x['source_id'] in gids]
          print(f"PROBE | 最终输出 {len(out)} 条（m5={per_mod.get('m5')} m7={per_mod.get('m7')}），GNews 剩 {len(gnews_o)}")
          for x in gnews_o: print(f"  OUT | {x['source_id']} [{x['module']}] score={x['score']} | {x['title'][:60]}")
          PY
