name: daily-digest

# 每天北京时间 06:30（UTC 22:30）自动生成简报并发布到 GitHub Pages
# 刻意错开整点：GitHub 官方明确说明整点是 Actions 高负载时段，schedule 事件可能被延迟甚至丢弃
# 预留约 30 分钟给生成+限流冷却，正常在 07:00 前后发布完成
#
# 触发源可能不止一个（GitHub 定时器、本机计划任务的补跑、云端自动化、手动运行），
# 因此 build 之前有 guard 闸门：北京时间当天若已有更早的运行（成功或进行中），
# 本次直接跳过，保证一天最多生成一次、只推一次飞书。
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:        # 支持在网页上手动点“运行”
    inputs:
      force:
        description: "强制重跑：忽略当天已运行过的检查"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: 当天只跑一次的幂等闸门
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone

          out = os.environ["GITHUB_OUTPUT"]
          if (os.environ.get("FORCE") or "").lower() == "true":
              print("force=true，跳过幂等检查")
              open(out, "a").write("skip=0\n")
              sys.exit(0)

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          bj = timezone(timedelta(hours=8))
          today = datetime.now(bj).date()
          url = ("https://api.github.com/repos/%s/actions/workflows/daily-digest.yml/runs?per_page=40"
                 % repo)
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "digest-guard"})
          try:
              runs = json.load(urllib.request.urlopen(req, timeout=30)).get("workflow_runs", [])
          except Exception as e:
              # 查不到就照常跑：宁可多跑一次，也不要因为 API 抖动当天空白
              print("查询运行记录失败（%s），本次照常执行" % e)
              open(out, "a").write("skip=0\n")
              sys.exit(0)

          for r in runs:
              if int(r["id"]) >= run_id:
                  continue                      # 只跟更早的比（run id 单调递增）
              if r.get("conclusion") in ("failure", "cancelled", "skipped"):
                  continue                      # 失败的不算数，允许重跑
              if r.get("status") not in ("completed", "in_progress", "queued", "waiting"):
                  continue
              try:
                  d = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(bj).date()
              except Exception:
                  continue
              if d == today:
                  print("当天已有更早的运行 #%s（%s/%s，%s），本次跳过"
                        % (r["id"], r.get("status"), r.get("conclusion"), r["created_at"]))
                  open(out, "a").write("skip=1\n")
                  sys.exit(0)

          print("当天尚无更早的运行，正常执行")
          open(out, "a").write("skip=0\n")
          PY

  build:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成简报
        env:
          TZ: Asia/Shanghai
          CLOUD_RUN: "1"                 # 云端出口在境外，需代理的英文源直接启用
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_daily.py

      - name: 提交数据（保持去重记忆与历史）
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data logs output sources.json settings.json || true
          git commit -m "digest: $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main || echo "rebase skipped"
          git push || echo "push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: [guard, build]
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 页面发布成功后，把当日要闻与完整版链接推送到飞书群
      # 失败不影响简报发布；未配置密钥则静默跳过
      - uses: actions/checkout@v4
      - name: 推送到飞书群
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ secrets.FEISHU_WEBHOOK_KEYWORD }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过推送"
            exit 0
          fi
          python tools/notify_feishu.py || echo "飞书推送失败，已忽略（简报不受影响）"
