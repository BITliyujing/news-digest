name: daily-digest

# 每天北京时间 06:30（UTC 22:30）自动生成简报并发布到 GitHub Pages
# 刻意错开整点：GitHub 官方明确说明整点是 Actions 高负载时段，schedule 事件可能被延迟甚至丢弃
# 预留约 30 分钟给生成+限流冷却，正常在 07:00 前后发布完成
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # 支持在网页上手动点“运行”

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成简报
        env:
          TZ: Asia/Shanghai
          CLOUD_RUN: "1"                 # 云端出口在境外，需代理的英文源直接启用
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_daily.py

      - name: 提交数据（保持去重记忆与历史）
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data logs output sources.json settings.json || true
          git commit -m "digest: $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main || echo "rebase skipped"
          git push || echo "push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 页面发布成功后，把当日要闻与完整版链接推送到飞书群
      # 失败不影响简报发布；未配置密钥则静默跳过
      - uses: actions/checkout@v4
      - name: 推送到飞书群
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ secrets.FEISHU_WEBHOOK_KEYWORD }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过推送"
            exit 0
          fi
          python tools/notify_feishu.py || echo "飞书推送失败，已忽略（简报不受影响）"
