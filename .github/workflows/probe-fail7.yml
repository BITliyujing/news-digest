name: probe-fail7
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: probe failing sources
        env:
          CLOUD_RUN: '1'
        run: |
          python - <<'PY'
          import json, sys, re
          sys.path.insert(0, '.')
          from digest import http, fetchers
          s = json.load(open('settings.json', encoding='utf-8'))
          rsspat = re.compile(r'<(rss|feed)\b', re.I)

          # (源, 说明, url, kind)  kind: feed=RSS解析 / list=通用列表
          cands = [
            ('economist', '官方RSS leaders', 'https://www.economist.com/leaders/rss', 'feed'),
            ('economist', '官方RSS latest', 'https://www.economist.com/latest/rss', 'feed'),
            ('economist', 'RSSHub', 'https://rsshub.rssforever.com/economist', 'feed'),
            ('economist', 'GNews', 'https://news.google.com/rss/search?q=site:economist.com+when:2d&hl=en-US&gl=US&ceid=US:en', 'feed'),
            ('barrons', '官方RSS', 'https://www.barrons.com/rss', 'feed'),
            ('barrons', 'GNews', 'https://news.google.com/rss/search?q=site:barrons.com+when:2d&hl=en-US&gl=US&ceid=US:en', 'feed'),
            ('reuters', 'RSSHub world', 'https://rsshub.rssforever.com/reuters/world', 'feed'),
            ('reuters', 'GNews world', 'https://news.google.com/rss/search?q=site:reuters.com/world+when:2d&hl=en-US&gl=US&ceid=US:en', 'feed'),
            ('iea', '官方feeds', 'https://www.iea.org/feeds/news-and-events', 'feed'),
            ('iea', 'RSSHub news', 'https://rsshub.rssforever.com/iea/news', 'feed'),
            ('iea', 'GNews', 'https://news.google.com/rss/search?q=site:iea.org+when:7d&hl=en-US&gl=US&ceid=US:en', 'feed'),
            ('isw', 'GNews', 'https://news.google.com/rss/search?q=site:understandingwar.org+when:3d&hl=en-US&gl=US&ceid=US:en', 'feed'),
            ('isw', 'RSSHub', 'https://rsshub.rssforever.com/understandingwar', 'feed'),
            ('caijing', '官方RSS', 'http://www.caijing.com.cn/rss', 'feed'),
            ('caijing', '栏目页', 'https://www.caijing.com.cn/news/', 'list'),
            ('huxiu', '官方RSS', 'https://rss.huxiu.com/', 'feed'),
            ('huxiu', 'RSSHub', 'https://rsshub.rssforever.com/huxiu', 'feed'),
          ]
          for sid, desc, url, kind in cands:
              try:
                  st, raw = http.fetch(url, s, referer=url, read_bytes=300000, timeout=20)
                  head = raw[:400].decode('utf-8', 'ignore')
                  isfeed = bool(rsspat.search(head)) or '<item' in head.lower()
                  n = 0; sample = ''
                  if isfeed:
                      items = fetchers._parse_rss_or_atom(raw, {'id': sid, 'name': sid, 'lang': 'zh'})
                      n = len(items)
                      if items:
                          sample = items[0]['title'][:60] + ' | ' + str(items[0].get('published'))
                  elif kind == 'list':
                      try:
                          items = fetchers.fetch_generic_list({'id': sid, 'name': sid, 'lang': 'zh', 'channel': {'home': url}}, s)
                          n = len(items)
                          if items: sample = items[0]['title'][:60]
                      except Exception as e2:
                          sample = 'generic: ' + str(e2)[:60]
                  print(f"PROBE | {sid:10s} | {desc:14s} | HTTP {st} | feed={isfeed} | n={n} | {sample}")
              except Exception as e:
                  print(f"PROBE | {sid:10s} | {desc:14s} | FAIL {type(e).__name__} {str(e)[:80]}")
          PY
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: .
          if-no-files-found: ignore
