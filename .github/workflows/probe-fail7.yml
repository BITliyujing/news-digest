name: probe-fail7
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: probe failing sources
        env:
          CLOUD_RUN: '1'
        run: |
          python - <<'PY'
          import json, sys, re
          sys.path.insert(0, '.')
          from digest import http, fetchers
          s = json.load(open('settings.json', encoding='utf-8'))
          rsspat = re.compile(r'<(rss|feed)\b', re.I)

          # (源, 说明, url, kind)  kind: feed=RSS解析 / list=通用列表
          cands = [
            ('huxiu', 'GNews中文', 'https://news.google.com/rss/search?q=site:huxiu.com+when:3d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans', 'feed'),
            ('huxiu', 'RSSHub官方', 'https://rsshub.app/huxiu', 'feed'),
            ('huxiu', 'RSSHub slarker', 'https://hub.slarker.me/huxiu', 'feed'),
            ('huxiu', '移动版列表', 'https://m.huxiu.com/', 'list'),
            ('caijing', 'GNews中文', 'https://news.google.com/rss/search?q=site:caijing.com.cn+when:3d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans', 'feed'),
            ('caijing', 'RSSHub官方', 'https://rsshub.app/caijing', 'feed'),
            ('caijing', 'rss.xml', 'http://www.caijing.com.cn/rss.xml', 'feed'),
            ('caijing', '栏目页40s超时', 'https://www.caijing.com.cn/news/', 'list'),
          ]
          for sid, desc, url, kind in cands:
              try:
                  st, raw = http.fetch(url, s, referer=url, read_bytes=300000, timeout=40)
                  head = raw[:400].decode('utf-8', 'ignore')
                  isfeed = bool(rsspat.search(head)) or '<item' in head.lower()
                  n = 0; sample = ''
                  if isfeed:
                      items = fetchers._parse_rss_or_atom(raw, {'id': sid, 'name': sid, 'lang': 'zh'})
                      n = len(items)
                      if items:
                          sample = items[0]['title'][:60] + ' | ' + str(items[0].get('published'))
                  elif kind == 'list':
                      try:
                          items = fetchers.fetch_generic_list({'id': sid, 'name': sid, 'lang': 'zh', 'channel': {'home': url}}, s)
                          n = len(items)
                          if items: sample = items[0]['title'][:60]
                      except Exception as e2:
                          sample = 'generic: ' + str(e2)[:60]
                  print(f"PROBE | {sid:10s} | {desc:14s} | HTTP {st} | feed={isfeed} | n={n} | {sample}")
              except Exception as e:
                  print(f"PROBE | {sid:10s} | {desc:14s} | FAIL {type(e).__name__} {str(e)[:80]}")
          PY
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: .
          if-no-files-found: ignore
