name: probe-network
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测校内 MaaS 连通性
        run: |
          echo "=== DNS ==="
          getent hosts maas.bit.edu.cn || echo "DNS 解析失败"
          echo "=== 公网 DNS ==="
          nslookup maas.bit.edu.cn 8.8.8.8 || true
          echo "=== HTTP ==="
          curl -sS -o /dev/null -w "HTTP %{http_code} time=%{time_total}s\n" --max-time 20 https://maas.bit.edu.cn/v1/models || echo "HTTP 请求失败"
