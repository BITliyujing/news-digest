name: Probe Gemini API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm OpenAI-compatible with stable lite model
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key=os.environ["KEY"].strip()
          def call(model):
              body={"model":model,"messages":[{"role":"user","content":"Reply with exactly: PONG"}],"max_tokens":20}
              req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
                  data=json.dumps(body).encode(),method="POST",
                  headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      d=json.loads(r.read().decode("utf-8","ignore"))
                      print(f"OPENAI:: {model} OK reply={d['choices'][0]['message'].get('content')!r} usage={d.get('usage')}")
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","ignore")
                  try: msg=json.loads(raw)["error"]["message"][:180]
                  except: msg=raw[:180]
                  print(f"OPENAI:: {model} HTTP{e.code} {msg}")
              except Exception as e:
                  print(f"OPENAI:: {model} ERR {type(e).__name__} {str(e)[:120]}")
          for m in ["gemini-flash-lite-latest","gemini-3.5-flash-lite","gemini-3.1-flash-lite"]:
              call(m)
          print("=== DONE ===")
          PY
