name: Probe Gemini API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe endpoints
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ["KEY"].strip()
          mask = lambda s: s.replace(key, "***KEY***")

          def req(name, method, url, headers, body=None, timeout=30):
              data = json.dumps(body).encode() if body is not None else None
              h = dict(headers)
              if data is not None:
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      raw = resp.read().decode("utf-8", "ignore")
                      print(f"[{name}] HTTP {resp.status}")
                      print(mask(raw[:900]))
                      return resp.status, raw
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "ignore")
                  print(f"[{name}] HTTP {e.code}")
                  print(mask(raw[:700]))
                  return e.code, raw
              except Exception as e:
                  print(f"[{name}] ERR {type(e).__name__}: {str(e)[:300]}")
                  return 0, ""

          payload = {
              "contents": [{"parts": [{"text": "只回复两个字：收到"}]}],
              "generationConfig": {"maxOutputTokens": 20},
          }
          chat = {
              "model": "gemini-2.5-flash",
              "messages": [{"role": "user", "content": "只回复两个字：收到"}],
              "max_tokens": 20,
          }
          print("=== 1) 官方原生 list models（x-goog-api-key）===")
          req("native-list", "GET",
              "https://generativelanguage.googleapis.com/v1beta/models",
              {"x-goog-api-key": key})
          print("=== 2) 官方原生 generateContent：gemini-2.5-flash ===")
          req("native-gen-flash", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
              {"x-goog-api-key": key}, payload)
          print("=== 3) 官方原生 generateContent：gemini-2.5-flash-lite ===")
          req("native-gen-lite", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent",
              {"x-goog-api-key": key}, payload)
          print("=== 4) OpenAI 兼容端点：gemini-2.5-flash ===")
          req("openai-compat", "POST",
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
              {"Authorization": "Bearer " + key}, chat)
          print("=== 5) 官方原生 generateContent：gemini-3-flash-preview ===")
          req("native-gen-3flash", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent",
              {"x-goog-api-key": key}, payload)
          print("=== DONE ===")
          PY
