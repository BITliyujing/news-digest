name: Probe Gemini API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe endpoints
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ["KEY"].strip()
          mask = lambda s: s.replace(key, "***KEY***")

          def req(name, method, url, headers, body=None, timeout=30):
              data = json.dumps(body).encode() if body is not None else None
              h = dict(headers)
              if data is not None:
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      raw = resp.read().decode("utf-8", "ignore")
                      print(f"[{name}] HTTP {resp.status}")
                      print("BODY::" + mask(raw)[:1500].replace("\n", " "))
                      return raw
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "ignore")
                  print(f"[{name}] HTTP {e.code}")
                  print("BODY::" + mask(raw)[:900].replace("\n", " "))
                  return raw
              except Exception as e:
                  print(f"[{name}] ERR {type(e).__name__}: {str(e)[:300]}")
                  return ""

          payload = {"contents": [{"parts": [{"text": "只回复两个字：收到"}]}],
                     "generationConfig": {"maxOutputTokens": 30}}

          print("=== LIST MODELS (full names) ===")
          raw = req("list", "GET", "https://generativelanguage.googleapis.com/v1beta/models",
                    {"x-goog-api-key": key})
          try:
              models = [m["name"].replace("models/", "") for m in json.loads(raw).get("models", [])]
              print("MODEL_COUNT::" + str(len(models)))
              for m in models:
                  print("MODEL::" + m)
          except Exception as e:
              print("PARSE_ERR::" + str(e)[:200])

          print("=== GEN gemini-2.5-flash ===")
          req("gen25flash", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
              {"x-goog-api-key": key}, payload)

          print("=== GEN gemini-3-flash-preview ===")
          req("gen3flash", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent",
              {"x-goog-api-key": key}, payload)

          print("=== GEN gemini-flash-latest ===")
          req("gen-latest", "POST",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent",
              {"x-goog-api-key": key}, payload)

          print("=== QUOTA metadata from list response headers ===")
          req("list-headers", "GET", "https://generativelanguage.googleapis.com/v1beta/models",
              {"x-goog-api-key": key})
          print("=== DONE ===")
          PY
